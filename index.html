    <!-- GitHub Pages Path Normalization & SPA 404 Routing -->
    <script>
      (function() {
        // 1. Ensure trailing slash for GitHub Pages repo URLs so relative assets resolve properly
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
          return;
        }

        // 2. GitHub Pages SPA Query-string restoration from 404.html redirect
        var search = window.location.search;
        if (search && search[1] === '/') {
          var decoded = search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            window.location.pathname.slice(0, -1) + decoded + window.location.hash
          );
        }
      })();
    </script>
