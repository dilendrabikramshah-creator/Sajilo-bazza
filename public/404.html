<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sajilo Bazar</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves path and query
      // Automatically detect if deployed under github.io subpath (1 segment) or custom root domain (0 segments)
      var isGithubPagesDomain = window.location.hostname.endsWith('github.io');
      var pathSegmentsToKeep = isGithubPagesDomain ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
